[package]
name = "deal-domain-hall"
version = "0.1.0"
description = "Domain direct threads, Deal hall messages, and pick signals for Solana Deal"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "deal_domain_hall"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "deal-core/idl-build",
    "deal-domain-entry/idl-build",
    "deal-domain-rank/idl-build",
    "deal-domain-registry/idl-build",
]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
deal-core = { path = "../deal-core", features = ["no-entrypoint"] }
deal-domain-entry = { path = "../deal-domain-entry", features = ["no-entrypoint"] }
deal-domain-rank = { path = "../deal-domain-rank", features = ["no-entrypoint"] }
deal-domain-registry = { path = "../deal-domain-registry", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-option = "3.0.0"
solana-program-pack = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
spl-token-interface = "2.0.0"
