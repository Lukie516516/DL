[package]
name = "deal-dividend"
version = "0.1.0"
description = "Protocol-treasury funded D snapshot dividends for Solana Deal"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "deal_dividend"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "deal-d-token/idl-build",
    "deal-governance-activity/idl-build",
    "deal-protocol-treasury/idl-build",
]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
deal-d-token = { path = "../deal-d-token", features = ["no-entrypoint"] }
deal-governance-activity = { path = "../deal-governance-activity", features = ["cpi"] }
deal-protocol-treasury = { path = "../deal-protocol-treasury", features = ["cpi"] }

[dev-dependencies]
deal-identity = { path = "../deal-identity", features = ["no-entrypoint"] }
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-option = "3.0.0"
solana-program-pack = "3.1.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
spl-token-interface = "2.0.0"
