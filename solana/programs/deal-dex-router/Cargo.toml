[package]
name = "deal-dex-router"
version = "0.1.0"
description = "Atomic single-hop and DC-routed swaps for Solana Deal pairs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "deal_dex_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "deal-dex-pair/idl-build"]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
deal-dex-pair = { path = "../deal-dex-pair", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-option = "3.0.0"
solana-program-pack = "3.1.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
spl-token-interface = "2.0.0"
