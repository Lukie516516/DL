[package]
name = "deal-governance-executor"
version = "0.1.0"
description = "Deal cross-VM governance quorum and execution program"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "deal_governance_executor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang.workspace = true
solana-keccak-hasher.workspace = true

[dev-dependencies]
deal-parameter-registry = { path = "../deal-parameter-registry", features = ["no-entrypoint"] }
litesvm = "0.10.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
