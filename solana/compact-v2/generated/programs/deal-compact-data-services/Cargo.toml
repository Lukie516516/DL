[package]
name = "deal-compact-data-services"
version = "0.1.0"
description = "Generated Deal Compact V2 data_services composition root"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "deal_compact_data_services"

[features]
default = []
no-entrypoint = []

[dependencies]
anchor-lang.workspace = true
deal-history-index = { path = "../../modules/deal-history-index", features = ["no-entrypoint"] }
deal-result-index = { path = "../../modules/deal-result-index", features = ["no-entrypoint"] }
deal-message-hub = { path = "../../modules/deal-message-hub", features = ["no-entrypoint"] }
