[package]
name = "deal-entry-composition"
version = "0.1.0"
description = "Proof that unchanged Anchor handlers can share one deployed program"
edition = "2021"
license = "MIT"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "deal_entry_composition"

[features]
default = []
no-entrypoint = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
deal-dex-pair = { path = "modules/deal-dex-pair", features = ["no-entrypoint"] }
deal-dex-quoter = { path = "modules/deal-dex-quoter", features = ["no-entrypoint"] }

[dev-dependencies]
anchor-spl = { version = "=1.0.2", default-features = false, features = ["associated_token", "mint", "token", "token_2022", "token_2022_extensions"] }
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program-option = "3.0.0"
solana-program-pack = "3.1.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
spl-token-interface = "2.0.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace]
members = [
    ".",
    "modules/deal-dex-pair",
    "modules/deal-dex-quoter",
]
resolver = "2"
