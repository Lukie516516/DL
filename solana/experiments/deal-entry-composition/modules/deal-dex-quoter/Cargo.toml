[package]
name = "deal-dex-quoter"
version = "0.1.0"
description = "Stateless RPC quote surface for the Solana Deal DEX"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "deal_dex_quoter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "deal-dex-pair/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
deal-dex-pair = { path = "../deal-dex-pair", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
